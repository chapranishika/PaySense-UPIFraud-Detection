name: CI

# Runs the project's real test suites on every push/PR so a regression is
# caught before merge instead of only being discovered by whoever happens to
# run the tests locally next. Nothing here re-trains the model or hits any
# live network dependency — both jobs are self-contained.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend — pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PaySense-ML-Backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: PaySense-ML-Backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pytest
        env:
          APP_ENV: production
        run: pytest tests/ -v

  android-tests:
    name: Android — unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: PaySense-Android-Client-New
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test --console=plain

      - name: Build debug APK
        run: ./gradlew assembleDebug --console=plain
